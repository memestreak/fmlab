<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="An interactive guide to FM synthesis."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>fmlab</title>
    <!-- Before the first paint, so a saved Light or Dark never flashes the
         other. The key and values are those of src/model/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('fmlab.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
    <!-- The page is shown once the script has drawn it and its fonts have
         arrived (src/main.ts sets data-ready), so nothing moves after the
         first paint. If that never happens, it is shown anyway after 3 s. -->
    <style>
      html:not([data-ready]) .page {
        visibility: hidden;
        animation: fmlab-reveal 0s 3s forwards;
      }
      @keyframes fmlab-reveal {
        to {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1 class="wordmark"><a href="#/">fmlab</a></h1>
        <!-- The way round the guide: the contents panel, where the reader
             is, and the glossary. Built by ui/contents.ts. -->
        <nav class="guide-nav" aria-label="Guide">
          <button
            id="contents-open"
            type="button"
            class="btn btn-quiet"
            aria-haspopup="dialog"
            aria-controls="contents"
            aria-expanded="false"
          >
            Contents
          </button>
          <span id="where" class="where"></span>
          <a href="#/glossary" class="guide-link">Glossary</a>
        </nav>
        <!-- A small icon button, as in frets: ui/themeSwitch.ts draws its
             icon and names it ("Theme: Auto") before the page shows. -->
        <button id="theme" type="button" class="theme-switch" aria-label="Theme: Auto"></button>
      </header>

      <!-- Two panes: the chapter's text, and the lab it talks about. Side
           by side on a wide screen, the text first on a narrow one. -->
      <main class="chapter">
        <!-- The chapter's title, lesson and maths, from src/chapters. -->
        <!-- On a wide screen this column scrolls on its own, beside the
             lab, so it is a tab stop to scroll it from the keyboard. -->
        <article
          id="narrative"
          class="narrative"
          tabindex="0"
          aria-label="Chapter text"
        ></article>

        <section class="lab" aria-label="Lab">
          <div class="controls">
            <div class="transport">
              <button id="play" type="button" class="btn btn-ink">Play</button>
              <!-- Only where there is a keyboard to press it on. -->
              <span class="hint" aria-hidden="true">Space: play / stop</span>
              <!-- Only where a chapter keeps its sound in the address. -->
              <button id="share" type="button" class="btn btn-quiet" hidden>
                Copy link
              </button>
              <!-- Only where the lab is pinned small above the text: shows
                   and hides the sliders and presets. -->
              <button
                id="controls-toggle"
                type="button"
                class="btn btn-quiet controls-toggle"
                aria-expanded="false"
                aria-controls="sliders"
              >
                Sliders
              </button>
              <!-- Chapter 9: which of its two sounds Play plays. -->
              <span id="hear-switch" class="switch" role="group" aria-label="Hear" hidden>
                <button id="hear-pm" type="button" class="switch-option" aria-pressed="true">Hear PM</button><button id="hear-fm" type="button" class="switch-option" aria-pressed="false">Hear FM</button>
              </span>
              <!-- Shown by a chapter that plays notes through an envelope. -->
              <label id="index-follows-toggle" class="check" hidden>
                <input id="index-follows" type="checkbox" />
                Index follows the envelope
              </label>
            </div>

            <!-- The presets and sliders: where the lab is pinned small, these
                 fold away behind the Sliders button. -->
            <div id="sliders" class="sliders">
              <!-- A chapter's presets, as buttons; filled in by script and
                   hidden when it has none. -->
              <div
                id="presets"
                class="presets"
                role="group"
                aria-label="Presets"
                hidden
              ></div>

              <!-- Every slider there is. A chapter shows the ones it names
                   in `controls`, matched on data-control. -->
              <div class="slider-row" data-control="volume">
                <label for="volume">Volume</label>
                <output id="volume-out" for="volume" class="num"></output>
                <input id="volume" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="carrier">
                <label for="carrier">Carrier</label>
                <output id="carrier-out" for="carrier" class="num"></output>
                <input id="carrier" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="ratio">
                <label for="ratio">Ratio</label>
                <output id="ratio-out" for="ratio" class="num"></output>
                <input id="ratio" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="index">
                <label for="index">Index</label>
                <output id="index-out" for="index" class="num"></output>
                <input id="index" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="modHz">
                <label for="modHz">Modulator</label>
                <output id="modHz-out" for="modHz" class="num"></output>
                <input id="modHz" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="deviation">
                <label for="deviation">Deviation</label>
                <output id="deviation-out" for="deviation" class="num"></output>
                <input id="deviation" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="attack">
                <label for="attack">Attack</label>
                <output id="attack-out" for="attack" class="num"></output>
                <input id="attack" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="decay">
                <label for="decay">Decay</label>
                <output id="decay-out" for="decay" class="num"></output>
                <input id="decay" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="sustain">
                <label for="sustain">Sustain</label>
                <output id="sustain-out" for="sustain" class="num"></output>
                <input id="sustain" type="range" class="slider" />
              </div>
              <div class="slider-row" data-control="release">
                <label for="release">Release</label>
                <output id="release-out" for="release" class="num"></output>
                <input id="release" type="range" class="slider" />
              </div>

              <!-- The sandbox's keyboard: built by ui/piano.ts. -->
              <div id="piano" class="piano" hidden></div>
            </div>
          </div>

          <!-- Six operators (chapter 8, and the sandbox's Six): two
               labelled panels, one above the other. The algorithm is the
               wiring: how it is chosen, its diagram (Fig. 1) and its
               feedback. The operators are the six sine waves it wires, a
               row each. Built by ui/operators.ts and ui/steps.ts. -->
          <div id="six-operators-lab" class="six-ops" hidden>
            <section class="panel panel-algorithm" aria-labelledby="algorithm-heading">
              <h3 id="algorithm-heading" class="panel-title">Algorithm</h3>
              <!-- One way to choose at a time, on one row of the same
                   height, so swapping them moves nothing. Chapter 8's
                   steps, a button each, the last of them DX7 algorithms;
                   or, at that last step and in the sandbox, the DX7's 32
                   in a list, with the sounds to start from. -->
              <div class="algorithm-chooser">
                <div id="steps" class="steps" role="group" aria-label="Wirings" hidden></div>
                <div id="dx7-chooser" class="dx7-chooser" hidden>
                  <button id="basic-wirings" type="button" class="step-option">
                    ‹ Basic wirings
                  </button>
                  <select
                    id="algorithm"
                    class="input num"
                    aria-label="DX7 algorithm"
                  ></select>
                  <div
                    id="dx7-presets"
                    class="presets dx7-presets"
                    role="group"
                    aria-label="Presets"
                    hidden
                  ></div>
                </div>
              </div>
              <div class="algorithm-body">
                <!-- The first of the figures below, shown and numbered as
                     they are, kept here with the algorithm it draws. -->
                <figure class="figure" data-figure="algorithm">
                  <div class="plot-frame">
                    <canvas id="algorithm-plot" class="plot plot-short" role="img"></canvas>
                  </div>
                  <figcaption>
                    Fig. <span class="figure-number"></span>&emsp;<span
                      id="algorithm-caption"
                    ></span>
                  </figcaption>
                </figure>
                <div class="slider-row" data-control="feedback">
                  <label for="feedback">Feedback</label>
                  <output id="feedback-out" for="feedback" class="num"></output>
                  <input id="feedback" type="range" class="slider" />
                </div>
                <!-- The sandbox's: on the source's own output, 0 to 2π. -->
                <div class="slider-row" data-control="dxFeedback">
                  <label for="dxFeedback">Feedback</label>
                  <output id="dxFeedback-out" for="dxFeedback" class="num"></output>
                  <input id="dxFeedback" type="range" class="slider" />
                </div>
              </div>
            </section>
            <section class="panel panel-operators" aria-labelledby="operators-heading">
              <h3 id="operators-heading" class="panel-title">Operators</h3>
              <!-- A row per operator; each number a slider, with a box
                   beside it to type in. -->
              <table id="operators" class="op-table">
                <thead>
                  <tr>
                    <th scope="col" class="op-col-name"><span class="visually-hidden">Operator</span></th>
                    <th scope="col" class="op-col-role"><span class="visually-hidden">Role</span></th>
                    <th scope="col">Ratio</th>
                    <th scope="col">Level %</th>
                    <th scope="col">Decay s</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </section>
          </div>

          <!-- Every figure there is. A chapter shows the ones it names in
               `figures`, matched on data-figure, and they are numbered
               from 1 in the order shown (.figure-number). -->

          <figure class="figure" data-figure="waveform">
            <div class="plot-frame">
              <canvas id="waveform" class="plot" role="img"></canvas>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="waveform-caption"
              ></span>
              <!-- Says when the figure is moving, and how slowed. -->
              <span id="waveform-note"></span>
            </figcaption>
          </figure>

          <figure class="figure" data-figure="envelope">
            <!-- Its dots are dragged; the Attack, Decay, Sustain and
                 Release sliders do the same from the keyboard. -->
            <div class="plot-frame">
              <canvas id="envelope" class="plot plot-short plot-drag" role="img"></canvas>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="envelope-caption"
              ></span>
            </figcaption>
          </figure>

          <figure class="figure" data-figure="spectrum">
            <div class="plot-frame">
              <!-- The spectrum predicted from the patch and, while sound
                   plays, measured from it over the top. See
                   ui/figures.ts. -->
              <canvas id="spectrum" class="plot" role="img"></canvas>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="spectrum-caption"
              ></span>
            </figcaption>
          </figure>

          <figure class="figure" data-figure="compare">
            <div class="plot-frame">
              <canvas id="compare" class="plot" role="img"></canvas>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="compare-caption"
              ></span>
            </figcaption>
          </figure>

          <figure class="figure" data-figure="spectrogram">
            <div class="plot-frame">
              <canvas id="spectrogram" class="plot" role="img"></canvas>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="spectrogram-caption"
              ></span>
            </figcaption>
          </figure>

          <figure class="figure" data-figure="bessel">
            <!-- The plot is also the index control: a slider, by pointer
                 or keyboard. See ui/besselControls.ts. -->
            <div class="plot-frame">
              <canvas
                id="bessel"
                class="plot plot-control"
                role="slider"
                tabindex="0"
                aria-label="Modulation index"
                aria-orientation="horizontal"
              ></canvas>
            </div>
            <div class="figure-tools">
              <!-- One button per curve, J0 to J8; filled in by script. -->
              <div
                id="bessel-orders"
                class="chips"
                role="group"
                aria-label="Pick out a sideband pair"
              ></div>
              <button id="vanish" type="button" class="btn btn-quiet">
                Make the carrier vanish
              </button>
            </div>
            <figcaption>
              Fig. <span class="figure-number"></span>&emsp;<span
                id="bessel-caption"
              ></span>
            </figcaption>
          </figure>
        </section>
      </main>

      <!-- The sandbox, an instrument page with no text column. Empty
           here: ui/instrument.ts moves the lab's own controls, figures and
           keyboard into it on the way in, and back on the way out, so
           every control keeps its element and id. -->
      <section id="instrument" class="inst" aria-labelledby="inst-title" hidden>
        <div class="inst-bar">
          <div class="inst-head">
            <h2 id="inst-title" class="inst-title" tabindex="-1"></h2>
            <p id="inst-lede" class="inst-lede"></p>
          </div>
          <!-- Volume. -->
          <div id="inst-tools" class="inst-tools"></div>
        </div>
        <div class="inst-body">
          <!-- Along the top, the wiring on the left and, on the right, the
               spectrum, with the selected operator's envelope view over
               it when one is open; the operator table the full width
               under both. -->
          <div class="inst-top">
            <div class="inst-left">
              <!-- The voices to start from, a step either side of the menu. -->
              <div class="inst-row inst-section-head">
                <h3 class="panel-title inst-section-title">Presets</h3>
                <div id="inst-dx7-presets"></div>
              </div>
              <!-- The algorithm list over the diagram it draws. -->
              <div class="inst-row inst-section-head inst-alg-head">
                <h3 class="panel-title inst-section-title">Algorithms</h3>
                <div id="inst-algorithm"></div>
              </div>
              <div class="inst-diagram">
                <!-- The diagram, with a step to the algorithm either side. -->
                <div class="inst-alg-step">
                  <button
                    id="inst-alg-prev"
                    type="button"
                    class="round-step"
                    aria-label="Previous algorithm"
                  >
                    ‹
                  </button>
                  <div id="inst-diagram-figure"></div>
                  <button
                    id="inst-alg-next"
                    type="button"
                    class="round-step"
                    aria-label="Next algorithm"
                  >
                    ›
                  </button>
                </div>
                <div id="inst-feedback"></div>
              </div>
            </div>
            <div class="inst-right">
              <section
                id="voice-envelope"
                class="voice-envelope"
                aria-labelledby="voice-envelope-title"
                hidden
              >
                <div class="voice-envelope-head">
                  <span id="voice-envelope-tag" class="op-tag"></span>
                  <span id="voice-envelope-role" class="op-role"></span>
                  <h3 id="voice-envelope-title" class="voice-envelope-title">Envelope</h3>
                  <button id="voice-envelope-close" type="button" class="btn btn-quiet">
                    Close
                  </button>
                </div>
                <div class="voice-envelope-body">
                  <canvas id="voice-envelope-curve" class="voice-envelope-curve" role="img"></canvas>
                  <div id="voice-envelope-knobs" class="voice-envelope-knobs"></div>
                </div>
              </section>
              <div id="inst-figures" class="inst-plate"></div>
            </div>
          </div>
          <!-- A row per operator of the DX7 voice (ui/voiceTable.ts). -->
          <section id="inst-operators" class="panel voice-panel" aria-labelledby="voice-heading">
            <h3 id="voice-heading" class="panel-title">Operators</h3>
            <table id="voice-table" class="op-table voice-table">
              <thead>
                <tr>
                  <th scope="col" class="op-col-name"><span class="visually-hidden">Operator</span></th>
                  <th scope="col" class="op-col-role"><span class="visually-hidden">Role</span></th>
                  <th scope="col">Ratio</th>
                  <th scope="col">Detune ¢</th>
                  <th scope="col">Level dB</th>
                  <th scope="col">Envelope</th>
                  <th scope="col">Across the keyboard</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>
        </div>
        <!-- The keyboard, across the foot; docked to the screen's foot on
             a phone. -->
        <div id="inst-keys" class="inst-keys"></div>
      </section>

      <!-- Every section, by group: opened by the Contents button. -->
      <dialog id="contents" class="contents-panel" aria-labelledby="contents-title">
        <div class="contents-head">
          <h2 id="contents-title">Contents</h2>
          <button id="contents-close" type="button" class="btn btn-quiet">Close</button>
        </div>
        <nav id="contents-list" aria-label="Sections"></nav>
      </dialog>

      <footer class="footer">
        <span class="footer-links">
          <a href="https://github.com/memestreak/fmlab">Source</a>
          <a href="#/glossary">Glossary</a>
        </span>
        <span id="commit" class="num"></span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
